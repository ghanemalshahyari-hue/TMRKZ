# MOVER — isolated on-premises stack (development / acceptance profile).
# Project name is distinct ("tmrkz-mover") so it never collides with other compose projects on the host.
# Only the web entry point is published. Images are pinned by exact version; see docs/OPERATIONS.md for
# building an offline bundle and docs/INSTALL_AIRGAPPED.md for egress controls (Docker alone is not isolation).
name: tmrkz-mover

services:
  # PostgreSQL 17.11 with PostGIS 3.5 (site boundaries, ADR-017). Same major version and data directory format as the
  # earlier postgres:17.11-alpine image, so an existing volume is upgraded in place by the V8 migration.
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mover
      POSTGRES_USER: mover
      POSTGRES_PASSWORD: ${MOVER_DB_PASSWORD:?set MOVER_DB_PASSWORD in .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mover -d mover"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: mover/backend:1.0.0
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      openfga:
        condition: service_healthy
    environment:
      MOVER_DB_URL: jdbc:postgresql://db:5432/mover
      MOVER_DB_USER: mover
      MOVER_DB_PASSWORD: ${MOVER_DB_PASSWORD}
      MOVER_STORAGE_ROOT: /var/lib/mover
      MOVER_MAP_ROOT: /opt/mover/map-packages
      MOVER_ATTESTATION_KEY: ${MOVER_ATTESTATION_KEY:?set MOVER_ATTESTATION_KEY (32+ chars) in .env}
      TMRKZ_HR_SETTINGS_KEY: ${TMRKZ_HR_SETTINGS_KEY:?set TMRKZ_HR_SETTINGS_KEY (32+ chars) in .env; run ops/init-env.sh}
      TMRKZ_HR_SYNC_INTERVAL_SECONDS: ${TMRKZ_HR_SYNC_INTERVAL_SECONDS:-3600}
      MOVER_SECURE_COOKIE: ${MOVER_SECURE_COOKIE:-false}
      # Enterprise sign-in (Keycloak federating the directory). The browser reaches Keycloak through the web entry
      # point under /auth; the backend uses the internal address for the token and key endpoints.
      TMRKZ_OIDC_ISSUER: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/auth/realms/tmrkz
      TMRKZ_OIDC_INTERNAL_URL: http://keycloak:8080/auth/realms/tmrkz
      TMRKZ_OIDC_CLIENT_ID: tmrkz-web
      TMRKZ_OIDC_CLIENT_SECRET: ${TMRKZ_OIDC_CLIENT_SECRET:?set TMRKZ_OIDC_CLIENT_SECRET in .env; run ops/init-env.sh}
      TMRKZ_OIDC_REDIRECT_URI: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/api/v1/auth/oidc/callback
      TMRKZ_OIDC_POST_LOGOUT_REDIRECT_URI: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/?signed-out=1
      TMRKZ_OIDC_LINK_KEY: ${TMRKZ_OIDC_LINK_KEY:-DOMAIN_ACCOUNT}
      # Manual sign-in: username and password verified by the same directory (LDAP bind over TLS), as in TNQL.
      LDAP_URL: ${LDAP_URL:?set LDAP_URL to the enterprise directory (ldaps://... or ldap://... with LDAP_START_TLS=true)}
      LDAP_START_TLS: ${LDAP_START_TLS:-true}
      LDAP_BIND_DN: ${LDAP_BIND_DN:?set LDAP_BIND_DN (read-only service account)}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:?set LDAP_BIND_CREDENTIAL}
      LDAP_USERS_DN: ${LDAP_USERS_DN:?set LDAP_USERS_DN}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-uid}
      LDAP_UUID_ATTRIBUTE: ${LDAP_UUID_ATTRIBUTE:-entryUUID}
      LDAP_EMPLOYEE_NUMBER_ATTRIBUTE: ${LDAP_EMPLOYEE_NUMBER_ATTRIBUTE:-employeeNumber}
      LDAP_USER_OBJECT_CLASS: ${LDAP_USER_OBJECT_CLASS:-inetOrgPerson}
      TMRKZ_LDAP_CA_DIR: /etc/tmrkz/ldap-ca
      # Authorisation decisions are confirmed by TMRKZ's own OpenFGA (ADR-018); without it sensitive actions are refused.
      TMRKZ_OPENFGA_API_URL: http://openfga:8080
      TMRKZ_OPENFGA_API_TOKEN: ${TMRKZ_OPENFGA_API_TOKEN:?set TMRKZ_OPENFGA_API_TOKEN in .env; run ops/init-env.sh}
    volumes:
      - files:/var/lib/mover
      - ${TMRKZ_TRUSTSTORE_DIR:-./ops/keycloak/truststores}:/etc/tmrkz/ldap-ca:ro
    networks: [internal]

  # One-shot: the identity provider's own database and role in the same PostgreSQL server (separate owner).
  db-init:
    image: postgis/postgis:17-3.5-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MOVER_DB_PASSWORD: ${MOVER_DB_PASSWORD}
      TMRKZ_KEYCLOAK_DB_PASSWORD: ${TMRKZ_KEYCLOAK_DB_PASSWORD:?set TMRKZ_KEYCLOAK_DB_PASSWORD in .env; run ops/init-env.sh}
      TMRKZ_OPENFGA_DB_PASSWORD: ${TMRKZ_OPENFGA_DB_PASSWORD:?set TMRKZ_OPENFGA_DB_PASSWORD in .env; run ops/init-env.sh}
    volumes:
      - ./ops/db/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    networks: [internal]

  # Identity provider: OIDC for TMRKZ, passwords verified by the enterprise directory (LDAP, read-only federation).
  # Not published on any host port; the admin console is not reachable through the web entry point.
  keycloak:
    image: tmrkz/keycloak:26.7.5-1
    build:
      context: .
      dockerfile: ops/keycloak/Dockerfile
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${TMRKZ_KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores
      KC_BOOTSTRAP_ADMIN_USERNAME: tmrkz-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TMRKZ_KEYCLOAK_ADMIN_PASSWORD:?set TMRKZ_KEYCLOAK_ADMIN_PASSWORD in .env; run ops/init-env.sh}
      # Values substituted into the realm on first import (ops/keycloak/realm/tmrkz-realm.json).
      TMRKZ_PUBLIC_URL: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}
      TMRKZ_OIDC_CLIENT_SECRET: ${TMRKZ_OIDC_CLIENT_SECRET}
      LDAP_URL: ${LDAP_URL:?set LDAP_URL to the enterprise directory (ldaps://... or ldap://... with LDAP_START_TLS=true)}
      LDAP_START_TLS: ${LDAP_START_TLS:-true}
      LDAP_BIND_DN: ${LDAP_BIND_DN:?set LDAP_BIND_DN (read-only service account)}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:?set LDAP_BIND_CREDENTIAL}
      LDAP_USERS_DN: ${LDAP_USERS_DN:?set LDAP_USERS_DN}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-uid}
      LDAP_UUID_ATTRIBUTE: ${LDAP_UUID_ATTRIBUTE:-entryUUID}
      LDAP_USER_OBJECT_CLASSES: ${LDAP_USER_OBJECT_CLASSES:-inetOrgPerson}
      LDAP_EMPLOYEE_NUMBER_ATTRIBUTE: ${LDAP_EMPLOYEE_NUMBER_ATTRIBUTE:-employeeNumber}
      LDAP_VENDOR: ${LDAP_VENDOR:-other}
    volumes:
      - ${TMRKZ_TRUSTSTORE_DIR:-./ops/keycloak/truststores}:/opt/keycloak/conf/truststores:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Authorisation decision service (OpenFGA 1.8.16), TMRKZ's own store in its own database. Not published on any host
  # port; only the backend calls it, with a preshared key. The playground is disabled.
  openfga-migrate:
    image: openfga/openfga:v1.8.16
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${TMRKZ_OPENFGA_DB_PASSWORD}@db:5432/openfga?sslmode=disable
    networks: [internal]

  openfga:
    image: openfga/openfga:v1.8.16
    restart: unless-stopped
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${TMRKZ_OPENFGA_DB_PASSWORD}@db:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${TMRKZ_OPENFGA_API_TOKEN}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
      OPENFGA_LOG_LEVEL: warn
    networks: [internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: mover/web:1.0.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "${MOVER_HTTP_PORT:-8088}:80"
    networks: [internal]

volumes:
  db-data:
  files:

networks:
  internal:
    driver: bridge
