# MOVER — isolated on-premises stack (development / acceptance profile).
# Project name is distinct ("tmrkz-mover") so it never collides with other compose projects on the host.
# Only the web entry point is published. Images are pinned by exact version; see docs/OPERATIONS.md for
# building an offline bundle and docs/INSTALL_AIRGAPPED.md for egress controls (Docker alone is not isolation).
name: tmrkz-mover

services:
  # PostgreSQL 17.11 with PostGIS 3.5 (site boundaries, ADR-017). Same major version and data directory format as the
  # earlier postgres:17.11-alpine image, so an existing volume is upgraded in place by the V8 migration.
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mover
      POSTGRES_USER: mover
      POSTGRES_PASSWORD: ${MOVER_DB_PASSWORD:?set MOVER_DB_PASSWORD in .env}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mover -d mover"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: mover/backend:1.0.0
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # the assistant's model server on this host (ADR-056); in the isolated network TMRKZ_AI_BASE_URL names the real one
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      openfga:
        condition: service_healthy
    environment:
      MOVER_DB_URL: jdbc:postgresql://db:5432/mover
      MOVER_DB_USER: mover
      MOVER_DB_PASSWORD: ${MOVER_DB_PASSWORD}
      MOVER_STORAGE_ROOT: /var/lib/mover
      MOVER_MAP_ROOT: /opt/mover/map-packages
      MOVER_ATTESTATION_KEY: ${MOVER_ATTESTATION_KEY:?set MOVER_ATTESTATION_KEY (32+ chars) in .env}
      TMRKZ_HR_SETTINGS_KEY: ${TMRKZ_HR_SETTINGS_KEY:?set TMRKZ_HR_SETTINGS_KEY (32+ chars) in .env; run ops/init-env.sh}
      TMRKZ_HR_SYNC_INTERVAL_SECONDS: ${TMRKZ_HR_SYNC_INTERVAL_SECONDS:-3600}
      MOVER_SECURE_COOKIE: ${MOVER_SECURE_COOKIE:-false}
      # Automatic employee sign-in: an external enterprise Keycloak client (Duty's model, ADR-071). Local defaults
      # preserve development/test stacks; they do not change to enterprise until TMRKZ_ENTERPRISE_OIDC_* are supplied.
      TMRKZ_OIDC_ISSUER: ${TMRKZ_ENTERPRISE_OIDC_ISSUER:-}
      TMRKZ_OIDC_INTERNAL_URL: ${TMRKZ_ENTERPRISE_OIDC_INTERNAL_URL:-}
      TMRKZ_OIDC_CLIENT_ID: ${TMRKZ_ENTERPRISE_OIDC_CLIENT_ID:-}
      TMRKZ_OIDC_CLIENT_SECRET: ${TMRKZ_ENTERPRISE_OIDC_CLIENT_SECRET:-}
      TMRKZ_LOCAL_OIDC_ISSUER: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/auth/realms/tmrkz
      TMRKZ_LOCAL_OIDC_INTERNAL_URL: http://keycloak:8080/auth/realms/tmrkz
      TMRKZ_LOCAL_OIDC_CLIENT_ID: tmrkz-web
      TMRKZ_LOCAL_OIDC_CLIENT_SECRET: ${TMRKZ_OIDC_CLIENT_SECRET:?set TMRKZ_OIDC_CLIENT_SECRET in .env; run ops/init-env.sh}
      TMRKZ_OIDC_REDIRECT_URI: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/api/v1/auth/oidc/callback
      TMRKZ_OIDC_POST_LOGOUT_REDIRECT_URI: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/?signed-out=1
      TMRKZ_OIDC_LINK_KEY: ${TMRKZ_OIDC_LINK_KEY:-DOMAIN_ACCOUNT}
      # The two lasting platform accounts use only the independent local provider and its dedicated manual client.
      TMRKZ_PLATFORM_ACCOUNTS: ${TMRKZ_PLATFORM_ACCOUNTS:-admin,developer}
      TMRKZ_PLATFORM_OIDC_CLIENT_ID: ${TMRKZ_PLATFORM_OIDC_CLIENT_ID:-tmrkz-platform-password}
      TMRKZ_PLATFORM_OIDC_CLIENT_SECRET: ${TMRKZ_PLATFORM_OIDC_CLIENT_SECRET:?set TMRKZ_PLATFORM_OIDC_CLIENT_SECRET in .env; run ops/init-env.sh}
      TMRKZ_PLATFORM_OIDC_ISSUER: ${TMRKZ_PLATFORM_OIDC_ISSUER:-}
      TMRKZ_PLATFORM_OIDC_INTERNAL_URL: ${TMRKZ_PLATFORM_OIDC_INTERNAL_URL:-}
      TMRKZ_PLATFORM_BROWSER_CLIENT_ID: ${TMRKZ_PLATFORM_BROWSER_CLIENT_ID:-}
      TMRKZ_PLATFORM_BROWSER_CLIENT_SECRET: ${TMRKZ_PLATFORM_BROWSER_CLIENT_SECRET:-}
      TMRKZ_PLATFORM_BROWSER_REDIRECT_URI: ${TMRKZ_PLATFORM_BROWSER_REDIRECT_URI:-}
      TMRKZ_PLATFORM_BROWSER_POST_LOGOUT_REDIRECT_URI: ${TMRKZ_PLATFORM_BROWSER_POST_LOGOUT_REDIRECT_URI:-}
      # «المساعد الذكي» (ADR-056), as TNQL: an OpenAI-compatible model server the site runs (Ollama on a development PC, the
      # organisation's own server in the isolated network). Off unless .env turns it on; the guide answers without it.
      TMRKZ_AI_ENABLED: ${TMRKZ_AI_ENABLED:-false}
      TMRKZ_AI_BASE_URL: ${TMRKZ_AI_BASE_URL:-http://host.docker.internal:11434/v1}
      TMRKZ_AI_MODEL: ${TMRKZ_AI_MODEL:-qwen2.5:7b}
      TMRKZ_AI_API_KEY: ${TMRKZ_AI_API_KEY:-}
      # Manual sign-in against the directory: these .env values apply until the directory is entered in «إعدادات التكامل» (ADR-092).
      LDAP_URL: ${LDAP_URL:-}
      LDAP_START_TLS: ${LDAP_START_TLS:-true}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:-}
      LDAP_USERS_DN: ${LDAP_USERS_DN:-}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-uid}
      LDAP_UUID_ATTRIBUTE: ${LDAP_UUID_ATTRIBUTE:-entryUUID}
      LDAP_EMPLOYEE_NUMBER_ATTRIBUTE: ${LDAP_EMPLOYEE_NUMBER_ATTRIBUTE:-employeeNumber}
      LDAP_USER_OBJECT_CLASS: ${LDAP_USER_OBJECT_CLASS:-inetOrgPerson}
      LDAP_DIRECT_BIND_PATTERN: ${LDAP_DIRECT_BIND_PATTERN:-}
      TMRKZ_LDAP_CA_DIR: /etc/tmrkz/ldap-ca
      # ADR-068: which directory attributes / ID-token claims carry unit ID, unit name, main unit ID, rank and position.
      # Empty: not read (the default). Keycloak's mappers: ops/keycloak/set-employment-attributes.sh.
      LDAP_ATTR_UNIT_ID: ${LDAP_ATTR_UNIT_ID:-}
      LDAP_ATTR_UNIT_NAME: ${LDAP_ATTR_UNIT_NAME:-}
      LDAP_ATTR_MAIN_UNIT_ID: ${LDAP_ATTR_MAIN_UNIT_ID:-}
      LDAP_ATTR_RANK: ${LDAP_ATTR_RANK:-}
      LDAP_ATTR_POSITION: ${LDAP_ATTR_POSITION:-}
      TMRKZ_OIDC_CLAIM_UNIT_ID: ${TMRKZ_OIDC_CLAIM_UNIT_ID:-}
      TMRKZ_OIDC_CLAIM_UNIT_NAME: ${TMRKZ_OIDC_CLAIM_UNIT_NAME:-}
      TMRKZ_OIDC_CLAIM_MAIN_UNIT_ID: ${TMRKZ_OIDC_CLAIM_MAIN_UNIT_ID:-}
      TMRKZ_OIDC_CLAIM_RANK: ${TMRKZ_OIDC_CLAIM_RANK:-}
      TMRKZ_OIDC_CLAIM_POSITION: ${TMRKZ_OIDC_CLAIM_POSITION:-}
      # Authorisation decisions are confirmed by TMRKZ's own OpenFGA (ADR-018); without it sensitive actions are refused.
      TMRKZ_OPENFGA_API_URL: http://openfga:8080
      TMRKZ_OPENFGA_API_TOKEN: ${TMRKZ_OPENFGA_API_TOKEN:?set TMRKZ_OPENFGA_API_TOKEN in .env; run ops/init-env.sh}
      # Outbound stationing events (ADR-031): a consumer endpoint inside the isolated network; empty = keep them PENDING.
      TMRKZ_STATIONING_OUTBOUND_URL: ${TMRKZ_STATIONING_OUTBOUND_URL:-}
      TMRKZ_STATIONING_OUTBOUND_TOKEN: ${TMRKZ_STATIONING_OUTBOUND_TOKEN:-}
    volumes:
      - files:/var/lib/mover
      - ${TMRKZ_TRUSTSTORE_DIR:-./ops/keycloak/truststores}:/etc/tmrkz/ldap-ca:ro
    networks: [internal]

  # One-shot: the identity provider's own database and role in the same PostgreSQL server (separate owner).
  db-init:
    image: postgis/postgis:17-3.5-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MOVER_DB_PASSWORD: ${MOVER_DB_PASSWORD}
      TMRKZ_KEYCLOAK_DB_PASSWORD: ${TMRKZ_KEYCLOAK_DB_PASSWORD:?set TMRKZ_KEYCLOAK_DB_PASSWORD in .env; run ops/init-env.sh}
      TMRKZ_OPENFGA_DB_PASSWORD: ${TMRKZ_OPENFGA_DB_PASSWORD:?set TMRKZ_OPENFGA_DB_PASSWORD in .env; run ops/init-env.sh}
    volumes:
      - ./ops/db/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    networks: [internal]

  # Identity provider: OIDC for TMRKZ, passwords verified by the enterprise directory (LDAP, read-only federation).
  # Not published on any host port; the admin console is not reachable through the web entry point.
  keycloak:
    image: tmrkz/keycloak:26.7.5-2
    build:
      context: .
      dockerfile: ops/keycloak/Dockerfile
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${TMRKZ_KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores
      KC_BOOTSTRAP_ADMIN_USERNAME: tmrkz-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TMRKZ_KEYCLOAK_ADMIN_PASSWORD:?set TMRKZ_KEYCLOAK_ADMIN_PASSWORD in .env; run ops/init-env.sh}
      # Values substituted into the realm on first import (ops/keycloak/realm/tmrkz-realm.json).
      TMRKZ_PUBLIC_URL: ${TMRKZ_PUBLIC_URL:-http://localhost:8088}
      TMRKZ_OIDC_CLIENT_SECRET: ${TMRKZ_OIDC_CLIENT_SECRET}
      LDAP_URL: ${LDAP_URL:?set LDAP_URL to the enterprise directory (ldaps://... or ldap://... with LDAP_START_TLS=true)}
      LDAP_START_TLS: ${LDAP_START_TLS:-true}
      LDAP_BIND_DN: ${LDAP_BIND_DN:?set LDAP_BIND_DN (read-only service account)}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:?set LDAP_BIND_CREDENTIAL}
      LDAP_USERS_DN: ${LDAP_USERS_DN:?set LDAP_USERS_DN}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-uid}
      LDAP_UUID_ATTRIBUTE: ${LDAP_UUID_ATTRIBUTE:-entryUUID}
      LDAP_USER_OBJECT_CLASSES: ${LDAP_USER_OBJECT_CLASSES:-inetOrgPerson}
      LDAP_EMPLOYEE_NUMBER_ATTRIBUTE: ${LDAP_EMPLOYEE_NUMBER_ATTRIBUTE:-employeeNumber}
      LDAP_VENDOR: ${LDAP_VENDOR:-other}
    volumes:
      - ${TMRKZ_TRUSTSTORE_DIR:-./ops/keycloak/truststores}:/opt/keycloak/conf/truststores:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Authorisation decision service (OpenFGA 1.8.16), TMRKZ's own store in its own database. Not published on any host
  # port; only the backend calls it, with a preshared key. The playground is disabled.
  openfga-migrate:
    image: openfga/openfga:v1.8.16
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${TMRKZ_OPENFGA_DB_PASSWORD}@db:5432/openfga?sslmode=disable
    networks: [internal]

  openfga:
    image: openfga/openfga:v1.8.16
    restart: unless-stopped
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${TMRKZ_OPENFGA_DB_PASSWORD}@db:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${TMRKZ_OPENFGA_API_TOKEN}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_LOG_FORMAT: json
      OPENFGA_LOG_LEVEL: warn
    networks: [internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: mover/web:1.0.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Stationing V3 pages stay out of the build until accepted (ADR-033); an installation may opt in from .env.
      args:
        STATIONING_V3: ${TMRKZ_STATIONING_V3:-false}
        FLOW_STUDIO_UI: ${TMRKZ_FLOW_STUDIO_UI:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      # with https (profile tls) set MOVER_HTTP_BIND=127.0.0.1 so the plain port is reachable from this host only
      - "${MOVER_HTTP_BIND:-0.0.0.0}:${MOVER_HTTP_PORT:-8088}:80"
    # The offline map root (ops/map-package/install_package.py): only its current/ package is served under /map-data/.
    volumes:
      - ${TMRKZ_MAP_ROOT:-./map-runtime}:/srv/tmrkz-map:ro
    networks: [internal]

  # https entry point, as TNQL's proxy (ADR-051): runs only with COMPOSE_PROFILES=tls in .env. It reuses the web image's nginx
  # (no further image in the offline bundle) with ops/tls/proxy.conf.template, and reads server.crt / server.key from
  # TMRKZ_TLS_DIR (ops/tls/make-csr.sh, ops/tls/install-cert.sh). Plain http on TMRKZ_HTTP_REDIRECT_PORT only redirects.
  proxy:
    image: mover/web:1.0.0
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      TMRKZ_HTTPS_PORT: ${TMRKZ_HTTPS_PORT:-443}
    ports:
      - "${TMRKZ_HTTPS_PORT:-443}:8443"
      - "${TMRKZ_HTTP_REDIRECT_PORT:-80}:8080"
    volumes:
      - ./ops/tls/proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TMRKZ_TLS_DIR:-./ops/tls/private}:/etc/tmrkz-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && pidof nginx >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [internal]

volumes:
  db-data:
  files:

networks:
  internal:
    driver: bridge
