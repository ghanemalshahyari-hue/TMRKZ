# Acceptance environment: the map root that ops/map-package/install_package.py fills (git-ignored map-data/runtime),
# mounted read-only like production (docker-compose.yml, TMRKZ_MAP_ROOT). The web entry point serves only its
# current/ package under /map-data/ (ADR-036). This file only points the mount at the acceptance root.
services:
  web:
    volumes:
      - ./map-data/runtime:/srv/tmrkz-map:ro
