# Acceptance test environment ONLY — never part of a production deployment.
# Adds a fictional directory (OpenLDAP over StartTLS with a test CA) and a fictional HR mirror and facility set, so the
# real sign-in path (browser → Keycloak → LDAP → TMRKZ) and the journeys can run end to end. Start it with
# ops/test-env/up.sh, which generates the test CA, certificates and passwords under ops/test-env/.generated/.
services:
  openldap:
    image: osixia/openldap:1.5.0
    restart: unless-stopped
    command: --copy-service
    environment:
      LDAP_ORGANISATION: "TMRKZ Test"
      LDAP_DOMAIN: "tmrkz.test"
      LDAP_ADMIN_PASSWORD: ${TEST_LDAP_ADMIN_PASSWORD:?run ops/test-env/up.sh}
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - ./ops/test-env/.generated/certs:/container/service/slapd/assets/certs
      - ./ops/test-env/.generated/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    networks: [internal]

  keycloak:
    depends_on:
      openldap:
        condition: service_started

  # Fictional organisations, HR mirror rows, people, grants and facilities (runs once the backend has migrated).
  test-seed:
    image: postgres:17.11-alpine
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGPASSWORD: ${MOVER_DB_PASSWORD}
    volumes:
      - ./ops/test-env/seed.sql:/seed.sql:ro
    entrypoint: ["psql", "-h", "db", "-U", "mover", "-d", "mover", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed.sql"]
    networks: [internal]
