# TMRKZ managed-file rules (ADR-104). One folder, one source, one repository: the same TMRKZ folder runs on the
# development machine and on the VM; only machine-specific settings, addresses, credentials, certificates and
# persistent data differ. These rules say which files of that folder an update carries.
#
# Read by ops/update/make-release.sh (the signed release manifest) and by ops/update/UpdateWorker.java (the
# installation's own copy decides — a release cannot relax the protected list, which the worker also hard-codes).
#
# Format: <class> <pattern>, first match wins. Patterns are paths relative to the TMRKZ folder: «*» matches within
# one path segment, «**» matches any number of segments, a pattern without a wildcard matches exactly.
#   protected  never read, compared, uploaded, written or deleted by an update (machine-specific or persistent)
#   dev        development only: never transferred (it may exist on a machine; an update leaves it alone)
#   config     application configuration a machine may have adapted: compared and shown, written only when the
#              administrator selects that file explicitly; a change needs one restart of the containers
#   app        the application: compared, uploaded when it differs, written when the update is approved
#   docs       documentation published inside the application (docs/ and handoff/)
# A path no rule names is «dev».

protected .env
protected .env.*
protected certs/**
protected data/**
protected backups/**
protected map-data/**
protected map-runtime/**
protected ops/local/.generated/**
protected ops/test-env/.generated/**
protected ops/hr-demo/.generated/**
protected ops/acceptance-main/.generated/**
protected ops/keycloak/ENTERPRISE_REGISTRATION.env*
protected tmrkz-images.tar
protected tmrkz-images.tar.sha256
protected release/**
protected .git/**

dev backend/src/test/**
dev backend/target/**
dev frontend/node_modules/**
dev frontend/dist/**
dev frontend/tsconfig.tsbuildinfo
dev tests/**
dev prototypes/**
dev docs/audit/**
dev docs/evidence/**
dev .github/**
dev .vscode/**
dev .zcode/**
dev .gitignore
dev .gitattributes
dev AGENTS.md
dev CLAUDE.md
dev FINAL_HANDOFF_2026-11-18.md

config docker-compose.yml
config docker-compose.override.yml
protected docker-compose.*.yml

app start.sh
app RUN.md
app README.md
app FONT-LICENSE.txt
app .dockerignore
app assets/**
app backend/pom.xml
app backend/.dockerignore
app backend/Dockerfile
app backend/src/main/**
app frontend/**
app ops/**
app map-packages/**

docs docs/**
docs handoff/**
