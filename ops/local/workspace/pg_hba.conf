# TMRKZ's database without passwords (owner, 19 Nov 2026): every connection is accepted. The database is reachable only on
# the application's internal Docker network (no published port, no route out), so only TMRKZ's own containers can connect.
# Used by docker-compose.override.yml for whatever cluster is in data/db, so a database brought from another machine needs
# no matching password. To require passwords again, change "trust" to "scram-sha-256" and run: docker compose up -d
local   all   all              trust
host    all   all   all        trust
local   replication   all      trust
host    replication   all   all   trust
