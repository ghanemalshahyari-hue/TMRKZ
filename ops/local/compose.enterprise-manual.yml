# Manual enterprise LDAP through a fixed TCP relay, while TMRKZ's application network remains isolated (ADR-070).
# The backend resolves only the approved directory DNS name to the internal bridge gateway. Nginx listens solely on that
# gateway:directory-port and relays raw TLS to the one configured upstream; application containers get no external route.
services:
  backend:
    extra_hosts:
      - "${TMRKZ_MANUAL_LDAP_DNS_NAME:?run ops/keycloak/configure-manual-direct.py}:${TMRKZ_MANUAL_LDAP_RELAY_GATEWAY:?generate the directory relay configuration}"

  ldap-relay:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${TMRKZ_MANUAL_LDAP_RELAY_CONFIG:?generate the directory relay configuration}:/etc/nginx/nginx.conf:ro
    command: ["nginx", "-g", "daemon off;"]
