# TMRKZ run straight from this folder (owner, 19 Nov 2026). Docker Compose reads this file together with docker-compose.yml
# whenever it is started in this folder without -f, so the whole installation is:
#
#     docker load -i tmrkz-images.tar        once, and again after a new tmrkz-images.tar
#     docker compose up -d                   TMRKZ_IP and TMRKZ_PORT in .env: the address people open
#
# (sh start.sh asks for the IP address and the port, writes them into .env and runs the two commands.)
#
# - The data lives in ./data: the database (data/db), the uploaded files (data/files) and the local directory (data/ldap-*).
# - The backend and the web are built from ./backend and ./frontend inside their containers and loaded a few seconds after
#   a change is saved — no image is built for a code change. Their images carry the build tools and dependencies.
# - Nothing is downloaded: images come only from tmrkz-images.tar. The database, Keycloak, OpenFGA and the local directory
#   are on a network with no route out; only the backend (for the enterprise directory and the enterprise Keycloak, reached
#   directly, ADR-092) and the web entry point (to publish the port) also join «edge».
# - One address everywhere (ADR-092): TMRKZ_PUBLIC_URL in .env is the address people open — written by start.sh from
#   TMRKZ_IP and TMRKZ_PORT (http://IP:PORT), or https://name by ops/tls/enable.sh — and every sign-in address derives from it.
# The tools that name their files with -f (ops/test-env, ops/verify-migration-path.sh, ops/airgap-bundle.sh) do not read
# this file and keep running the image-built application.
name: tmrkz

x-address: &address "${TMRKZ_PUBLIC_URL:?write in .env the address people open TMRKZ with (TMRKZ_PUBLIC_URL=http://IP:PORT), or run: sh start.sh}"

services:
  # no database password (owner, 19 Nov 2026): the access rules come from ops/local/workspace/pg_hba.conf whatever cluster
  # is in data/db; the database is reachable only on the internal network
  db:
    pull_policy: never
    command: ["postgres", "-c", "hba_file=/etc/tmrkz/pg_hba.conf"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./ops/local/workspace/pg_hba.conf:/etc/tmrkz/pg_hba.conf:ro

  db-init:
    pull_policy: never

  # the local directory (no enterprise directory configured in .env): users container only, StartTLS with the CA of
  # ops/local/.generated/certs; its data in ./data
  openldap:
    image: osixia/openldap:1.5.0
    pull_policy: never
    restart: unless-stopped
    command: --copy-service
    environment:
      LDAP_ORGANISATION: "TMRKZ"
      LDAP_DOMAIN: "tmrkz.local"
      LDAP_ADMIN_PASSWORD: ${LOCAL_LDAP_ADMIN_PASSWORD:?set LOCAL_LDAP_ADMIN_PASSWORD in .env}
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - ./ops/local/.generated/certs:/container/service/slapd/assets/certs
      - ./ops/local/.generated/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - ./data/ldap-data:/var/lib/ldap
      - ./data/ldap-config:/etc/ldap/slapd.d
    networks: [internal]

  keycloak:
    build: !reset null
    pull_policy: never
    depends_on:
      openldap:
        condition: service_started
    environment:
      KC_HOSTNAME: "${TMRKZ_PUBLIC_URL}/auth"
      TMRKZ_PUBLIC_URL: *address
    volumes: !override
      - ${TMRKZ_TRUSTSTORE_DIR:-./ops/local/.generated/truststore}:/opt/keycloak/conf/truststores:ro

  # once per start: the sign-in return address follows TMRKZ_IP/TMRKZ_PORT, and the two platform accounts (admin,
  # developer) and their manual-sign-in client are set from .env — what ops/keycloak/set-public-url.sh,
  # ops/platform-accounts.sh and ops/keycloak/set-platform-password-client.sh do on an image-built installation
  keycloak-setup:
    image: tmrkz/keycloak:26.7.5-2
    pull_policy: never
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["bash", "/setup/keycloak-setup.sh"]
    environment:
      PUBLIC_URL: *address
      KC_ADMIN_PASSWORD: ${TMRKZ_KEYCLOAK_ADMIN_PASSWORD}
      ADMIN_PASSWORD: ${TMRKZ_PLATFORM_ADMIN_PASSWORD:?set TMRKZ_PLATFORM_ADMIN_PASSWORD in .env}
      DEVELOPER_PASSWORD: ${TMRKZ_PLATFORM_DEVELOPER_PASSWORD:?set TMRKZ_PLATFORM_DEVELOPER_PASSWORD in .env}
      PASSWORD_CLIENT_ID: ${TMRKZ_PLATFORM_OIDC_CLIENT_ID:-tmrkz-platform-password}
      PASSWORD_CLIENT_SECRET: ${TMRKZ_PLATFORM_OIDC_CLIENT_SECRET}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_CREDENTIAL: ${LDAP_BIND_CREDENTIAL:-}
      LOGIN_THEME: ${TMRKZ_KEYCLOAK_LOGIN_THEME:-keycloak.v2}
      OIDC_CLIENT_SECRET: ${TMRKZ_OIDC_CLIENT_SECRET:-}
    volumes:
      - ./ops/local/workspace/keycloak-setup.sh:/setup/keycloak-setup.sh:ro
    networks: [internal]

  openfga-migrate:
    pull_policy: never

  openfga:
    pull_policy: never

  backend:
    image: tmrkz/folder-backend:1
    build: !reset null
    pull_policy: never
    environment:
      TMRKZ_LOCAL_OIDC_ISSUER: "${TMRKZ_PUBLIC_URL}/auth/realms/tmrkz"
      TMRKZ_OIDC_REDIRECT_URI: "${TMRKZ_PUBLIC_URL}/api/v1/auth/oidc/callback"
      TMRKZ_OIDC_POST_LOGOUT_REDIRECT_URI: "${TMRKZ_PUBLIC_URL}/?signed-out=1"
      JAVA_OPTS: "-XX:MaxRAMPercentage=60 -Duser.timezone=UTC -Dfile.encoding=UTF-8"
    # the enterprise directory and the enterprise Keycloak are reached directly (ADR-092): their
    # addresses, certificates and secrets are entered in «إعدادات النظام ← إعدادات التكامل», not in a relay or in .env
    networks: [internal, edge]
    volumes:
      - ./backend:/workspace/backend:ro
      # the build-and-run script from this folder, over the copy in the image (a change to it needs no new tmrkz-images.tar)
      - ./ops/local/workspace/backend-run.sh:/usr/local/bin/tmrkz-backend-run:ro
      - ./map-packages:/opt/tmrkz/map-packages:ro
      - ./data/files:/var/lib/tmrkz
      # the migration center's backup gate (ADR-094) reads the manifests ops/backup.sh writes; dumps go to data/files/migration-inbox
      - ./backups:/var/lib/tmrkz/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/system/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 600s

  # builds ./frontend (type check, then the bundle) into the web server's volume, again after every saved change; no network
  web-build:
    image: tmrkz/folder-web:1
    pull_policy: never
    restart: unless-stopped
    network_mode: none
    environment:
      VITE_STATIONING_V3: ${TMRKZ_STATIONING_V3:-false}
      VITE_FLOW_STUDIO: ${TMRKZ_FLOW_STUDIO_UI:-false}
    volumes:
      - ./frontend:/workspace/frontend:ro
      - ./ops/local/workspace/web-run.sh:/usr/local/bin/tmrkz-web-run:ro
      - ./docs:/workspace/docs:ro
      - ./handoff:/workspace/handoff:ro
      - web-html:/out/html
      - web-docs:/out/docs
    healthcheck:
      test: ["CMD-SHELL", "test -f /out/html/index.html"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 900s

  web:
    image: nginx:1.28.3-alpine
    build: !reset null
    pull_policy: never
    depends_on:
      web-build:
        condition: service_healthy
    # the only published port; the map's numeric group is kept for shared folders (ops/local/map-worker.sh)
    ports: !override
      - "0.0.0.0:${TMRKZ_PORT:-8088}:80"
    entrypoint: ["/bin/sh", "/etc/tmrkz/map-worker.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      TMRKZ_MAP_GID: ${TMRKZ_MAP_GID:-0}
    volumes:
      - web-html:/usr/share/nginx/html:ro
      - web-docs:/usr/share/nginx/docs:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/local/map-worker.sh:/etc/tmrkz/map-worker.sh:ro
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  proxy:
    image: nginx:1.28.3-alpine
    pull_policy: never
    networks: [internal, edge]


networks:
  # the servers' network has no route out of the machine; the backend, web and the https proxy also join «edge»
  internal:
    internal: true
  edge:
    driver: bridge

volumes:
  web-html:
  web-docs:
