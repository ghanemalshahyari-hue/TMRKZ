# MOVER web entry point: static SPA + local docs + reverse proxy to the backend.
# Runs inside the isolated network; no upstream other than the backend container.

server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;

    client_max_body_size 25m;
    proxy_read_timeout 120s;

    root /usr/share/nginx/html;

    # Security headers for the application (no external origins anywhere).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
    }

    # Identity provider (Keycloak, relative path /auth). Resolved per request so the web entry point starts on its own.
    # The administration console and the master realm are never served here; administrators use an internal path.
    location ^~ /auth/admin/ { return 404; }
    location ^~ /auth/realms/master/ { return 404; }
    location /auth/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        # Keycloak sends its own Content-Security-Policy for its pages.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /fonts/ {
        types { font/ttf ttf; }
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Offline documentation copied from the repository docs/ folder.
    # The archived prototype is a self-contained HTML file with inline scripts, so this path gets its own CSP
    # (still no network access: connect-src 'none').
    location /docs/ {
        alias /usr/share/nginx/docs/;
        autoindex on;
        types {
            text/html html;
            text/plain md txt json js;
            text/css css;
            application/geo+json geojson;
            image/svg+xml svg;
            application/zip zip;
        }
        add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback (routing is hash-based, but deep links to "/" variants still resolve).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
