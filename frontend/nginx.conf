# MOVER web entry point: static SPA + local docs + reverse proxy to the backend.
# Runs inside the isolated network; no upstream other than the backend container.

# Behind the https entry point (profile tls, ADR-051) the original scheme is https: pass it on to the backend and Keycloak.
map $http_x_forwarded_proto $tmrkz_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Embedding (ADR-102, ADR-108). No allowed site ('none'): every frame is refused, as before. Allowed sites: X-Frame-Options is
# left out (it cannot name a site; a browser that obeys it rather than frame-ancestors refuses every frame), and Keycloak's
# sign-in pages may be framed by the same sites, otherwise the automatic sign-in inside a frame shows the browser's
# "blocked" page.
map $tmrkz_frame_ancestors $tmrkz_frame_options {
    "'none'" "DENY";
    default  "";
}
map $tmrkz_frame_ancestors $tmrkz_kc_frame_ancestors {
    "'none'" "'self'";
    default  $tmrkz_frame_ancestors;
}
map $tmrkz_frame_ancestors $tmrkz_kc_frame_options {
    "'none'" "SAMEORIGIN";
    default  "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;

    client_max_body_size 25m;
    proxy_read_timeout 120s;

    root /usr/share/nginx/html;

    # Security headers — frame-ancestors is set by the embedding map (embedding.conf, managed by the admin UI).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $tmrkz_frame_ancestors" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $tmrkz_frame_options always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tmrkz_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
    }

    # Identity provider (Keycloak, relative path /auth). Resolved per request so the web entry point starts on its own.
    # The administration console and the master realm are never served here; administrators use an internal path.
    location ^~ /auth/admin/ { return 404; }
    location ^~ /auth/realms/master/ { return 404; }
    location /auth/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tmrkz_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        # Keycloak's own frame headers (realm default: frame-src 'self'; frame-ancestors 'self'; object-src 'none' and
        # SAMEORIGIN) are replaced by the same policy with the embedding allowlist as ancestors (ADR-108).
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-src 'self'; frame-ancestors $tmrkz_kc_frame_ancestors; object-src 'none'" always;
        add_header X-Frame-Options $tmrkz_kc_frame_options always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
        # MapLibre 6's worker is an ES module (.mjs), an extension nginx's mime.types does not map: served as
        # application/octet-stream under nosniff, the browser refuses the module worker and the map stays blank.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }

    location /fonts/ {
        types { font/ttf ttf; }
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Offline documentation copied from the repository docs/ folder.
    # The archived prototype is a self-contained HTML file with inline scripts, so this path gets its own CSP
    # (still no network access: connect-src 'none').
    location /docs/ {
        alias /usr/share/nginx/docs/;
        autoindex on;
        types {
            text/html html;
            text/plain md txt json js;
            text/css css;
            application/geo+json geojson;
            image/svg+xml svg;
            application/zip zip;
        }
        add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' data:; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $tmrkz_frame_ancestors" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options $tmrkz_frame_options always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Desktop notifications (ADR-050, as in TNQL): the service worker at the root, never cached, allowed to control the whole
    # origin. It only draws toasts the page hands it; it fetches nothing and caches nothing.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback (routing is hash-based, but deep links to "/" variants still resolve).
    # The installed offline map package (ADR-036, ops/map-package/README.md): the map root is mounted read-only at
    # /srv/tmrkz-map and only its current/ package is served, PMTiles with HTTP range requests. previous/, history/ and
    # staging directories are never reachable, links are not followed, and the slope analysis and source tiles (inputs
    # of the database loader, not of the map) are not served. Without a mounted package every request is a plain 404.
    location ^~ /map-data/terrain/glo30/analysis/ {
        return 404;
    }
    location ^~ /map-data/terrain/glo30/source/ {
        return 404;
    }
    # The installed map package is static after an install: an installer swap replaces every file at once
    # (ops/map-package/swap). Serve it with ETag + Last-Modified revalidation, not `no-store`: a cold load still
    # hits every file (first install), but a warm load becomes a cheap 304 Not Modified. When a package switch
    # changes the file's bytes or mtime, the ETag/Last-Modified change and the browser revalidates to the new
    # content — stale package content cannot be served (brief §18, fallback form; versioned-URL immutable caching
    # requires the client to learn the installed package id first, deferred to a later change).
    location /map-data/ {
        alias /srv/tmrkz-map/current/;
        # VirtualBox/shared filesystems may reject sendfile(2); stream package reads through nginx instead.
        sendfile off;
        disable_symlinks on;
        limit_except GET { deny all; }
        types {
            application/json json;
            font/ttf ttf;
            text/plain txt;
        }
        default_type application/octet-stream;
        etag on;
        if_modified_since exact;
        add_header Cache-Control "public, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
