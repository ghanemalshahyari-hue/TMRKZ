spring:
  application:
    name: mover
  datasource:
    url: ${MOVER_DB_URL:jdbc:postgresql://localhost:5432/mover}
    username: ${MOVER_DB_USER:mover}
    password: ${MOVER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${MOVER_DB_POOL:20}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  main:
    banner-mode: off

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: audit
  check-process-definitions: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: mover

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

mover:
  version: 1.0.0
  storage:
    root: ${MOVER_STORAGE_ROOT:/var/lib/mover}
  map:
    root: ${MOVER_MAP_ROOT:/opt/mover/map-packages}
  signature:
    attestation-key: ${MOVER_ATTESTATION_KEY:}
  security:
    session-idle-minutes: ${MOVER_SESSION_IDLE_MINUTES:30}
    session-absolute-hours: ${MOVER_SESSION_ABSOLUTE_HOURS:12}
    secure-cookie: ${MOVER_SECURE_COOKIE:false}
    max-failed-logins: 5
    lock-minutes: 15
  outbox:
    enabled: ${MOVER_OUTBOX_ENABLED:true}
    poll-ms: 2000

tmrkz:
  oidc:
    # Public realm URL (appears as "iss" in tokens and serves the browser) and the same realm on the internal network.
    issuer: ${TMRKZ_OIDC_ISSUER:}
    internal-base-url: ${TMRKZ_OIDC_INTERNAL_URL:}
    client-id: ${TMRKZ_OIDC_CLIENT_ID:tmrkz-web}
    client-secret: ${TMRKZ_OIDC_CLIENT_SECRET:}
    redirect-uri: ${TMRKZ_OIDC_REDIRECT_URI:}
    post-logout-redirect-uri: ${TMRKZ_OIDC_POST_LOGOUT_REDIRECT_URI:}
    # First sign-in links on DOMAIN_ACCOUNT (preferred_username = HR domain account, as TNQL) or EMPLOYEE_NUMBER.
    link-key: ${TMRKZ_OIDC_LINK_KEY:DOMAIN_ACCOUNT}
    enterprise-key-claim: ${TMRKZ_OIDC_EMPLOYEE_NUMBER_CLAIM:employee_number}
    reauth-max-age-seconds: ${TMRKZ_REAUTH_MAX_AGE_SECONDS:300}
  hr:
    # Protects stored HR source credentials; TMRKZ's own key, never another application's.
    settings-key: ${TMRKZ_HR_SETTINGS_KEY:}
    # Seconds, like TNQL_HR_SYNC_INTERVAL (whose default was one day); TMRKZ defaults to hourly.
    sync-interval-seconds: ${TMRKZ_HR_SYNC_INTERVAL_SECONDS:3600}
    initial-delay-seconds: ${TMRKZ_HR_INITIAL_DELAY_SECONDS:60}
    max-run-seconds: ${TMRKZ_HR_MAX_RUN_SECONDS:1800}
    scheduler-enabled: ${TMRKZ_HR_SCHEDULER_ENABLED:true}
