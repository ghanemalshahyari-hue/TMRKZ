spring:
  application:
    name: tmrkz
  datasource:
    url: ${TMRKZ_DB_URL:${MOVER_DB_URL:jdbc:postgresql://localhost:5432/tmrkz}}
    username: ${TMRKZ_DB_USER:${MOVER_DB_USER:tmrkz}}
    password: ${TMRKZ_DB_PASSWORD:${MOVER_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: ${MOVER_DB_POOL:20}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  main:
    banner-mode: off

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: audit
  check-process-definitions: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: tmrkz

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

mover:
  version: 1.0.0
  storage:
    root: ${TMRKZ_STORAGE_ROOT:${MOVER_STORAGE_ROOT:/var/lib/tmrkz}}
  map:
    root: ${TMRKZ_MAP_PACKAGES:${MOVER_MAP_ROOT:/opt/tmrkz/map-packages}}
  signature:
    attestation-key: ${TMRKZ_ATTESTATION_KEY:${MOVER_ATTESTATION_KEY:}}
  security:
    session-idle-minutes: ${MOVER_SESSION_IDLE_MINUTES:30}
    session-absolute-hours: ${MOVER_SESSION_ABSOLUTE_HOURS:12}
    secure-cookie: ${TMRKZ_SECURE_COOKIE:${MOVER_SECURE_COOKIE:false}}
    max-failed-logins: 5
    lock-minutes: 15
  outbox:
    enabled: ${MOVER_OUTBOX_ENABLED:true}
    poll-ms: 2000

tmrkz:
  oidc:
    # Automatic (employee) sign-in, ADR-071: the external enterprise Keycloak client when an issuer is supplied (Compose feeds
    # these from TMRKZ_ENTERPRISE_OIDC_*); while the issuer is empty, the whole local provider below. Every empty value counts as
    # not supplied (OidcProperties normalises it), so an empty Compose value never erases a default or borrows another provider.
    # Public realm URL (appears as "iss" in tokens and serves the browser) and the same realm on the internal network.
    issuer: ${TMRKZ_OIDC_ISSUER:}
    internal-base-url: ${TMRKZ_OIDC_INTERNAL_URL:}
    client-id: ${TMRKZ_OIDC_CLIENT_ID:tmrkz-web}
    client-secret: ${TMRKZ_OIDC_CLIENT_SECRET:}
    redirect-uri: ${TMRKZ_OIDC_REDIRECT_URI:}
    post-logout-redirect-uri: ${TMRKZ_OIDC_POST_LOGOUT_REDIRECT_URI:}
    # The local Keycloak realm of the lasting platform accounts (ADR-071): stable values, independent of the enterprise provider.
    local-issuer: ${TMRKZ_LOCAL_OIDC_ISSUER:}
    local-internal-base-url: ${TMRKZ_LOCAL_OIDC_INTERNAL_URL:}
    local-client-id: ${TMRKZ_LOCAL_OIDC_CLIENT_ID:tmrkz-web}
    local-client-secret: ${TMRKZ_LOCAL_OIDC_CLIENT_SECRET:}
    local-redirect-uri: ${TMRKZ_LOCAL_OIDC_REDIRECT_URI:}
    local-post-logout-redirect-uri: ${TMRKZ_LOCAL_OIDC_POST_LOGOUT_REDIRECT_URI:}
    # Optional overrides of the platform provider (platform step-up and logout); empty: the local provider above. They never
    # default to the enterprise provider while local values exist.
    platform-issuer: ${TMRKZ_PLATFORM_OIDC_ISSUER:}
    platform-internal-base-url: ${TMRKZ_PLATFORM_OIDC_INTERNAL_URL:}
    platform-client-id: ${TMRKZ_PLATFORM_BROWSER_CLIENT_ID:}
    platform-client-secret: ${TMRKZ_PLATFORM_BROWSER_CLIENT_SECRET:}
    platform-redirect-uri: ${TMRKZ_PLATFORM_BROWSER_REDIRECT_URI:}
    platform-post-logout-redirect-uri: ${TMRKZ_PLATFORM_BROWSER_POST_LOGOUT_REDIRECT_URI:}
    # ADR-070: the backend-only confidential client through which the platform accounts use the manual form (direct password
    # grant at the platform provider only; ops/keycloak/set-platform-password-client.sh). No secret: manual platform sign-in off.
    password-client-id: ${TMRKZ_PLATFORM_OIDC_CLIENT_ID:tmrkz-platform-password}
    password-client-secret: ${TMRKZ_PLATFORM_OIDC_CLIENT_SECRET:}
    # First sign-in links on DOMAIN_ACCOUNT (preferred_username = HR domain account, as TNQL) or EMPLOYEE_NUMBER.
    link-key: ${TMRKZ_OIDC_LINK_KEY:DOMAIN_ACCOUNT}
    enterprise-key-claim: ${TMRKZ_OIDC_EMPLOYEE_NUMBER_CLAIM:employee_number}
    reauth-max-age-seconds: ${TMRKZ_REAUTH_MAX_AGE_SECONDS:300}
    # Sent as max_age on every sign-in, so the provider must state auth_time (equals the 12-hour session limit).
    login-max-age-seconds: ${TMRKZ_LOGIN_MAX_AGE_SECONDS:43200}
    # Lasting platform accounts (V21): logins that, holding the provider's realm role tmrkz-platform, sign in as local
    # administrators that HR and the directory never disable. Empty: none. Created by ops/platform-accounts.sh.
    platform-accounts: ${TMRKZ_PLATFORM_ACCOUNTS:}
    # ADR-068: names of the ID-token claims carrying the employment attributes (Keycloak: ops/keycloak/set-employment-attributes.sh
    # maps them as tmrkz_unit_id, tmrkz_unit_name, tmrkz_main_unit_id, tmrkz_rank, tmrkz_position). Empty: not read.
    unit-id-claim: ${TMRKZ_OIDC_CLAIM_UNIT_ID:}
    unit-name-claim: ${TMRKZ_OIDC_CLAIM_UNIT_NAME:}
    main-unit-id-claim: ${TMRKZ_OIDC_CLAIM_MAIN_UNIT_ID:}
    rank-claim: ${TMRKZ_OIDC_CLAIM_RANK:}
    position-claim: ${TMRKZ_OIDC_CLAIM_POSITION:}
  ldap:
    # Manual sign-in (username and password verified by the directory); the same LDAP_* values configure Keycloak's federation.
    # LDAP_DIRECT_BIND_PATTERN (ADR-070): exactly one {username}, e.g. {username}@corp.example — the person binds as themselves
    # and that connection reads their entry; empty: the read-only service account (bind-dn) finds the entry first.
    # ADR-100: no service account is required. LDAP_DOMAIN gives {username}@domain; with no pattern, no domain and no complete
    # service account, the domain is the DC= parts of LDAP_USERS_DN (DC=corp,DC=example → corp.example).
    url: ${LDAP_URL:}
    domain: ${LDAP_DOMAIN:}
    start-tls: ${LDAP_START_TLS:true}
    bind-dn: ${LDAP_BIND_DN:}
    bind-credential: ${LDAP_BIND_CREDENTIAL:}
    users-dn: ${LDAP_USERS_DN:}
    username-attribute: ${LDAP_USERNAME_ATTRIBUTE:uid}
    uuid-attribute: ${LDAP_UUID_ATTRIBUTE:entryUUID}
    employee-number-attribute: ${LDAP_EMPLOYEE_NUMBER_ATTRIBUTE:employeeNumber}
    user-object-class: ${LDAP_USER_OBJECT_CLASS:inetOrgPerson}
    direct-bind-pattern: ${LDAP_DIRECT_BIND_PATTERN:}
    ca-dir: ${TMRKZ_LDAP_CA_DIR:/etc/tmrkz/ldap-ca}
    # ADR-068: names of the directory attributes carrying the employment attributes in this organisation. Empty: not read.
    unit-id-attribute: ${LDAP_ATTR_UNIT_ID:}
    unit-name-attribute: ${LDAP_ATTR_UNIT_NAME:}
    main-unit-id-attribute: ${LDAP_ATTR_MAIN_UNIT_ID:}
    rank-attribute: ${LDAP_ATTR_RANK:}
    position-attribute: ${LDAP_ATTR_POSITION:}
  hr:
    # Protects stored HR source credentials; TMRKZ's own key, never another application's.
    settings-key: ${TMRKZ_HR_SETTINGS_KEY:}
    # Seconds, like TNQL_HR_SYNC_INTERVAL (whose default was one day); TMRKZ defaults to hourly.
    sync-interval-seconds: ${TMRKZ_HR_SYNC_INTERVAL_SECONDS:3600}
    initial-delay-seconds: ${TMRKZ_HR_INITIAL_DELAY_SECONDS:60}
    max-run-seconds: ${TMRKZ_HR_MAX_RUN_SECONDS:1800}
    scheduler-enabled: ${TMRKZ_HR_SCHEDULER_ENABLED:true}
  access:
    # MOVER's facilities roles with their permissions on a NEW database (ADR-078): only the backend tests and the fictional
    # acceptance environment, which still exercise the facilities reservation engine. Everywhere else they are seeded empty.
    legacy-facility-roles: ${TMRKZ_LEGACY_FACILITY_ROLES:false}
  authz:
    # TMRKZ's own OpenFGA (never another application's store). The preshared key comes from the environment.
    api-url: ${TMRKZ_OPENFGA_API_URL:}
    api-token: ${TMRKZ_OPENFGA_API_TOKEN:}
    store-id: ${TMRKZ_OPENFGA_STORE_ID:}
    store-name: ${TMRKZ_OPENFGA_STORE_NAME:tmrkz}
    timeout-ms: ${TMRKZ_OPENFGA_TIMEOUT_MS:5000}
    poll-ms: 2000
    reconcile-ms: 300000
    sync-enabled: ${TMRKZ_OPENFGA_SYNC_ENABLED:true}
  signing:
    # Certificate signatures and seals (ADR-020): NONE (PKI mode fails closed) or PKCS12_DIRECTORY (mounted key stores).
    provider: ${TMRKZ_SIGNING_PROVIDER:NONE}
    keystore-dir: ${TMRKZ_SIGNING_KEYSTORE_DIR:/etc/tmrkz/signing/keystores}
    keystore-password-file: ${TMRKZ_SIGNING_KEYSTORE_PASSWORD_FILE:/etc/tmrkz/signing/keystore-password}
    trust-dir: ${TMRKZ_SIGNING_TRUST_DIR:/etc/tmrkz/signing/trust}
    crl-dir: ${TMRKZ_SIGNING_CRL_DIR:/etc/tmrkz/signing/crl}
